{% extends "market/base.html" %}
{% block content %}
<div class="card" style="max-width:480px;margin:2rem auto">
  <h2>Confirm delete</h2>
  <p>Are you sure you want to delete <b>{{ object }}</b>?<br>This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn" type="submit" style="background:#b3261e">Yes, delete</button>
    <a class="btn" href="javascript:history.back()" style="background:#777">Cancel</a>
  </form>
</div>
{% endblock %}
